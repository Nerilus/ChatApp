spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/chat_app?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

# App Properties
bezkoder.app.jwtSecret=${JWT_SECRET:Y2hhdEFwcFN1cGVyU2VjcmV0S2V5Rm9ySldUVG9rZW5TaWduaW5nMTIzNDU2Nzg5MDEyMzQ1Ng==}
bezkoder.app.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}

# Verbose Logging
logging.level.com.server.server=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.messaging=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Audio MIME Mappings (prevent browser video container slow motion playback)
server.servlet.mime-mapping.webm=audio/webm
server.servlet.mime-mapping.ogg=audio/ogg
server.servlet.mime-mapping.mp4=audio/mp4
server.servlet.mime-mapping.m4a=audio/mp4